id: REQ-CAPTURE-007
type: requirement
title: Sync-style source ingestion through the nomination seam
body: Extend capture beyond git-milestone code diffs to ingest external corpora (documents, issues, chat and meeting transcripts, CRM records) as candidate nodes. Ingested content never enters the graph directly; it flows through the same validated nomination seam (propose, then human or agent review, then accept via the CLI), so external data becomes typed, attributed lattice nodes rather than a raw scraped silo. Each sync provider maps external records to proposed nominations (new source, new requirement, or edges to existing nodes), preserving the nominate-not-commit guardrail and keeping provenance. Mirrors the managed/worker sync distinction from context-system practice.
