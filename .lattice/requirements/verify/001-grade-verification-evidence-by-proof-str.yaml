id: REQ-VERIFY-001
type: requirement
title: Grade verification evidence by proof strength
body: 'Record how strongly an implementation''s satisfaction of a requirement is proven, not just that it is claimed. Add a proof-level to verification metadata on a certainty ladder adapted from pstack''s blast-radius skill: asserted (claimed only), pointed (a real file:line or source reference), shown (the failure case walked through and shown impossible), ran (a script or test exercising the real code), reproduced (observed in the running app). Verification output and health checks can then distinguish asserted-only satisfaction from reproduced satisfaction, so reviewers and agents see where confidence actually stops. Complements the existing tests_pass and coverage fields.'
