id: REQ-EVAL-003
type: requirement
title: 'Failure-to-eval capture: nominations emit a reproducing eval'
body: 'Extend the capture nominator so that when a real session failure or correction is nominated, it proposes not only a skill or node edit but also a new eval task that reproduces the failure. This is how the frozen corpus grows from real usage rather than imagination (the observed-failure bar), and it closes the loop: the failure that motivated a change becomes the test that proves the change and guards against its regression. Like all nominations it enters through the validated accept seam, never directly.'
