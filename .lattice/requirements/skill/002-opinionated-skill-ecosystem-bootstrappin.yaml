id: REQ-SKILL-002
type: requirement
title: Opinionated skill-ecosystem bootstrapping for users without opinions
body: 'Most teams lack a settled opinion about which agent skills to adopt: a jagged frontier where a few power users have strong setups, most have none, and wiring skills one at a time is a configuration tax. Lattice should help a user assemble a curated, opinionated starting ecosystem of agent skills, its own plus vetted external stacks (e.g. pstack, mattpocock/skills), matched to their project, rather than leaving them to discover and glue skills by hand. Because Lattice is skill-aware and holds the project knowledge graph, it can recommend a coherent default set and the install glue, which the user then adapts. Opt-in, adaptable, never locked: a fast on-ramp for the opinion-less, not a mandated stack.'
