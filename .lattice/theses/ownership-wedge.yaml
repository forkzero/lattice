id: THX-OWNERSHIP-WEDGE
type: thesis
title: Owned, Version-Aware Context Is the Defensible Wedge Against Hosted Context Platforms
body: 'As incumbents (e.g. Notion) build hosted, governed context systems for human-agent collaboration, Lattice''s defensible differentiation is twofold. First, context ownership: the graph lives in the team''s own Git, not a vendor cloud, fulfilling the own-the-context principle that hosted platforms undercut by requiring you to slurp everything into them. Second, version-aware drift detection: the structural mechanism for curing context rot that hosted platforms name as the central problem but address only aspirationally. Lattice is also native to software and code teams, where the agent factory already operates in Git. The wedge is not breadth of collaboration features (mobile, notifications, company-wide permissions) but ownership plus epistemic integrity.'
