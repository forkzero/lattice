id: THX-EVAL-GATED-IMPROVEMENT
type: thesis
title: Continual Skill Improvement Must Be Gated by a Versioned, Failure-Sourced Eval Corpus
body: 'Shipping skill updates on a cadence (daily, weekly, monthly) is only safe if each update is provably better, and better is undefinable against a moving target. The gate is a frozen, held-out eval corpus: tasks with observable success predicates, sourced from real session failures rather than hypotheticals, and versioned so each task''s provenance is known. An update ships only when the new version scores at least as well as the current one across the frozen set, strictly better on the case that motivated it, with zero regressions, and the comparison is recorded at a proof-level (ran or reproduced, not asserted). Cadence is just how often the loop runs; provability comes from the A/B comparison and the eval corpus, not the schedule. Evals are the bottleneck, not the pipeline: where success has no observable predicate the skill stays human-verified, and claims are always relative to a named eval set at a stated proof-level, never provably better in the abstract. Lattice is the ledger of this process: versioned skill nodes, eval nodes with provenance, verified improvement edges, and drift detection over stale evals.'
